name: "Go Build & Tests"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check-changelog:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check if CHANGELOG.md was updated
        run: |
          git fetch origin main
          if ! git diff --name-only origin/main HEAD | grep -q '^CHANGELOG.md$'; then
            echo "CHANGELOG.md was not updated compared to main. Please update the changelog."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.27"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Verify dependencies
        run: |
          go mod tidy
          git diff --exit-code # Fails if go mod tidy changed anything
      - name: Build
        run: go build -v ./...
      - name: Test with Race Detector
        run: go test -race -v ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.1
