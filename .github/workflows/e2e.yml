name: "e2e Player Tests"

# Separate from go.yml so the README can show a badge for the player tests alone.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  e2e-linux:
    name: e2e (HLS conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Check the HLS output against Media Foundation's constraints
        run: go test -race -tags e2e -count=1 -v ./src/e2e/...

  # Plays the stream through Windows Media Foundation, which VRChat's AVPro player uses on PC.
  # VRChat itself cannot run on a CI runner, so this is the closest stand-in.
  e2e-windows:
    name: e2e (Media Foundation playback)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install Media Foundation
        shell: pwsh
        run: |
          $feature = Get-WindowsFeature Server-Media-Foundation
          if (-not $feature.Installed) {
            $result = Install-WindowsFeature Server-Media-Foundation
            if ($result.RestartNeeded -eq 'Yes') {
              Write-Warning "Media Foundation asks for a restart, playback may fail until the runner image ships it"
            }
          }
          Get-WindowsFeature Server-Media-Foundation | Format-Table -AutoSize
      # Media Foundation refuses to play without an audio endpoint, and the runners have none
      - name: Set up a virtual audio device
        uses: LABSN/sound-ci-helpers@v1
      - name: Build the Media Foundation test player
        run: dotnet publish test/mfplayer -c Release -r win-x64 --self-contained false -o "${{ runner.temp }}/mfplayer"
      - name: Play the stream through Media Foundation
        env:
          MFPLAYER: ${{ runner.temp }}\mfplayer\mfplayer.exe
        run: go test -tags e2e -count=1 -v -run MediaFoundation ./src/e2e/...
