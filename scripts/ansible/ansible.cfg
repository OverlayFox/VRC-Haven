[defaults]
# Only localhost, the instances are added at runtime from the Linode API
inventory = inventory.yml
interpreter_python = auto_silent
retry_files_enabled = False
stdout_callback = default
result_format = yaml

[ssh_connection]
pipelining = True
# New instances have unknown host keys, accept them on first connect but still refuse a changed key
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
