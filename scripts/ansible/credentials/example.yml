# Copy to credentials/<linode username>.yml and encrypt it:
#   ansible-vault encrypt credentials/<linode username>.yml
#
# The file name is the Linode username passed as -e linode_user=<name>.
# The SSH keys on that user's Linode profile are installed for root on every instance,
# so the key you run Ansible with must be one of them.

# Personal access token with Read/Write on Linodes
linode_token: ""

# Passphrase of the flagship the escorts connect to
flagship_passphrase: ""

# The dashboard port is only opened in the firewall when a password is set,
# otherwise reach it with: ssh -L 8080:localhost:8080 root@<instance ip>
dashboard_user: ""
dashboard_password: ""
