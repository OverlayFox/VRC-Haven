# Copy to credentials/<linode username>.yml and encrypt it:
#   ansible-vault encrypt credentials/<linode username>.yml
#
# The file name is what you pass as -e linode_user=<name>, your Linode username is a good choice.

# Personal access token with Linodes: Read/Write and Events: Read Only, everything else No Access.
# Events are needed because the Linode modules poll them while waiting for an instance to boot.
linode_token: ""

# Passphrase of the flagship the escorts connect to
flagship_passphrase: ""

# The dashboard port is only opened in the firewall when a password is set,
# otherwise reach it with: ssh -L 8080:localhost:8080 root@<instance ip>
dashboard_user: ""
dashboard_password: ""
