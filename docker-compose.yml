# Start the flagship:  docker compose up -d
# Start an escort:     docker compose up -d escort
#
# Fill in the values marked "change me" below. All other settings are listed in .env.example.

services:
  flagship:
    build:
      context: .
      args:
        TARGET: flagship
    image: vrc-haven:flagship
    environment:
      # Make these up. Letters, numbers and dashes only, the passphrase must be 10 to 79 characters
      SRT_STREAM_ID: my-event # change me
      SRT_PASSPHRASE: choose-a-long-passphrase # change me

      # From your free MaxMind account
      GEO_ACCOUNT_ID: "123456" # change me
      GEO_LICENSE_KEY: your-license-key # change me

      # Optional, the dashboard stays off while these are empty
      DASHBOARD_USERNAME: ""
      DASHBOARD_PASSWORD: ""
    ports:
      - "8890:8890/udp"
      - "8080:8080/tcp"
      - "8090:8090/tcp"
    volumes:
      - geo-data:/app/geoDatabases
    restart: unless-stopped

  escort:
    profiles: [escort]
    build:
      context: .
      args:
        TARGET: escort
    image: vrc-haven:escort
    environment:
      # Must be the same as on the flagship
      SRT_STREAM_ID: my-event # change me
      SRT_PASSPHRASE: choose-a-long-passphrase # change me

      # The flagship's IP address or domain name
      HAVEN_FLAGSHIP_ADDRESS: flagship-ip # change me

      # Optional, the dashboard stays off while these are empty
      DASHBOARD_USERNAME: ""
      DASHBOARD_PASSWORD: ""
    ports:
      - "8080:8080/tcp"
      - "8090:8090/tcp"
    restart: unless-stopped

volumes:
  geo-data:
